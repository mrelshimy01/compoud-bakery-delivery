<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101827">
  <meta name="description" content="MoharamBake delivery and supply dashboard">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <title>MoharamBake · Delivery</title>
</head>
<body>
  <div class="app-shell">

    <section id="loginScreen" class="login-screen">
      <div class="login-card">
        <div class="brand-mark">🥖</div>
        <div class="eyebrow">MOHARAMBAKE</div>
        <h1>Delivery</h1>
        <p class="muted">Sign in to manage deliveries and supply.</p>

        <form id="loginForm" autocomplete="on">
          <label>
            Delivery Man
            <input id="username" name="username" type="text" autocomplete="username" placeholder="Username" required>
          </label>

          <label>
            Password
            <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Password" required>
          </label>

          <button id="loginButton" class="primary-btn full" type="submit">
            Login
          </button>

          <div id="loginError" class="error"></div>
        </form>
      </div>
    </section>

    <section id="appScreen" class="app-screen hidden">

      <header class="topbar">
        <div>
          <div class="brand-title">MoharamBake</div>
          <div id="userLabel" class="brand-subtitle"></div>
        </div>

        <button id="logoutButton" class="ghost-btn" type="button">
          Logout
        </button>
      </header>

      <nav id="mainNav" class="main-nav" aria-label="Main navigation">
        <button class="nav-button active" data-view="delivery" type="button">
          🚚 Delivery
        </button>
        <button class="nav-button" data-view="supply" type="button">
          🏭 Supply
        </button>
      </nav>

      <div class="toolbar">
        <button id="refreshButton" class="refresh-btn" type="button">
          ↻ Refresh
        </button>
        <span id="lastUpdated" class="updated-label"></span>
      </div>

      <div id="loading" class="loading hidden">
        Loading…
      </div>

      <main>
        <section id="deliveryView" class="view">
          <div class="section-heading">
            <div>
              <div class="eyebrow">DELIVERY</div>
              <h2>Deliveries</h2>
              <p id="deliverySummary" class="muted"></p>
            </div>
          </div>
          <div id="deliveryOrders"></div>
        </section>

        <section id="supplyView" class="view hidden">
          <div class="section-heading">
            <div>
              <div class="eyebrow">SUPPLY</div>
              <h2>Supply</h2>
              <p id="supplySummary" class="muted"></p>
            </div>
          </div>
          <div id="supplyList"></div>
        </section>
      </main>
    </section>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
